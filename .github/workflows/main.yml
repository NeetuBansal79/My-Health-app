name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Generate app icon and splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0ea57a' --iconBackgroundColorDark '#0f2e25' || echo "asset step skipped"
      - name: Sync web into Android
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyHealthApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
